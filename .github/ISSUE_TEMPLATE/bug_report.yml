name: Bug 报告
description: 报告一个问题或缺陷
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: desc
    attributes:
      label: 问题描述
      description: 清晰简洁地描述遇到的问题
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      description: 你期望的正确行为是什么
    validations:
      required: false
  - type: textarea
    id: env
    attributes:
      label: 环境信息
      description: 操作系统、运行时版本、浏览器等
      placeholder: |
        - OS:
        - 版本:
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: 截图 / 日志
      description: 有助于定位问题的任何补充材料
    validations:
      required: false
